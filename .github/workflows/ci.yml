name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'StockAlerts/**', 'StockAlertsTests/**', 'Packages/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # CI runs unsigned. The macOS Development profile this app needs (for
      # keychain-access-groups) is locked to specific device UDIDs that change
      # every run on macos-latest. Instead of jumping through App Store Connect
      # API hoops to register the runner each run, we disable signing here and
      # skip the one suite that exercises keychain-access-groups
      # (KeychainStoreTests). Local pre-push runs via scripts/test.sh still
      # cover that suite end-to-end.
      - name: Write Local.xcconfig
        run: printf 'DEVELOPMENT_TEAM =\n' > Local.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      # The hexagon's Domain/Application/Adapters tests live in the SPM package
      # and need no signing — run them directly. (The app's xcodebuild step
      # below builds the package as a dependency but does not run these.)
      - name: Run package tests (StockAlertsKit)
        run: swift test --package-path Packages/StockAlertsKit

      - name: Run tests (unsigned, KeychainStoreTests skipped)
        run: |
          xcodebuild \
            -project StockAlerts.xcodeproj \
            -scheme StockAlerts \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/StockAlerts.xcresult \
            -skip-testing:StockAlertsTests/KeychainStoreTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StockAlerts.xcresult
          path: build/StockAlerts.xcresult
